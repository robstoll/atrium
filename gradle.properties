kotlin.code.style=official

# kotlin-test is intentionally compileOnly: factory users supply it; assertion-only users do not need it.
# Both Kotlin/JS consumer paths are verified. KGP cannot suppress this diagnostic for a single dependency.
kotlin.suppressGradlePluginWarnings=IncorrectCompileOnlyDependencyWarning

# com.github.vlsi.gradle-extensions prints only failing or slow test results
slowTestLogThreshold=500
slowSuiteLogThreshold=5000

# the project requires at least the following memory to not run into OOM in github actions
org.gradle.jvmargs=-Xmx1200m
